[project]
name = "categories"
version = "1.0.0"
description = "Categories Module API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "loguru",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"