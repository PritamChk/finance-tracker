[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["reports_app"]

[project]
name = "reports"
version = "1.0.0"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy>=2.0.49",
    "pydantic>=2.13.3",
    "loguru>=0.7.2",
    "reportlab>=4.0.0",
    "python-jose>=3.3.0",
    "Pillow>=11.0.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
