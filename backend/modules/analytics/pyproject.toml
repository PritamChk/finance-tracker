[project]
name = "analytics"
version = "0.1.0"
description = "Financial analytics module"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "loguru",
    "python-dateutil",
    "shared",
]

[dependency-groups]
dev = []

[tool.uv.sources]
shared = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
